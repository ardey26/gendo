# The gendo app on Render: one web service (the keyless server, which also serves the built app)
# and a disk for its SQLite file. Preprod only.
services:
  - type: web
    name: gendo-app
    runtime: node
    plan: starter
    buildCommand: npm ci --prefix sdk && npm ci --prefix server && npm ci --prefix app && VITE_NETWORK=Preprod npm run build --prefix app
    startCommand: server/gendo-server
    healthCheckPath: /
    domains:
      - app.gendo.cash
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.11.0
      - key: VAULT_NETWORK
        value: Preprod
      - key: DB
        value: /var/data/gendo.sqlite
      # Render's edge sets this to the visitor's address; without it every visitor shares one rate limit.
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      - key: BLOCKFROST_PROJECT_ID
        sync: false
